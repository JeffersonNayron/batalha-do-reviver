[project]
name = "batalha-do-reviver"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23,<26",
  "pydantic>=2.9,<3",
  "tzdata",
]

[tool.vercel]
entrypoint = "app:app"

[tool.vercel.fastapi.static]
cdn = false
